services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthai_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://neondb_owner:npg_rRAQuW1aGXP8@ep-silent-unit-alzcd4nm.c-3.eu-central-1.aws.neon.tech/neondb?sslmode=require
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production_please_32chars}
      PORT: 5000
      NODE_ENV: production
    ports:
      - "5000:5000"
    networks:
      - healthai_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthai_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - healthai_network

networks:
  healthai_network:
    driver: bridge


